name: Market Data Watchdog

on:
  workflow_dispatch:
  schedule:
    # Scheduler indipendente, sfalsato rispetto al workflow principale.
    # Controlla ogni 5 minuti ma lavora solo se i dati hanno almeno 12 minuti.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

concurrency:
  group: market-data-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watchdog-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica freschezza dati
        id: freshness
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('data/market-data.json')
          run_update = True
          age_minutes = 9999
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
              ts = data.get('generatedAt')
              if ts:
                  generated = datetime.fromisoformat(ts.replace('Z', '+00:00'))
                  if generated.tzinfo is None:
                      generated = generated.replace(tzinfo=timezone.utc)
                  age_minutes = (datetime.now(timezone.utc) - generated.astimezone(timezone.utc)).total_seconds() / 60
                  run_update = age_minutes >= 12
          except Exception as exc:
              print(f'freshness_error={type(exc).__name__}')
              run_update = True

          print(f'age_minutes={age_minutes:.1f}')
          print(f'run_update={str(run_update).lower()}')
          PY

      - name: Python setup
        if: steps.freshness.outputs.run_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.freshness.outputs.run_update == 'true'
        run: pip install yfinance pandas numpy requests deep-translator

      - name: Rigenera dati sito
        if: steps.freshness.outputs.run_update == 'true'
        run: |
          python scripts/update_market_data.py
          python scripts/investment_trend_health_guard.py snapshot
          python scripts/refresh_trading_intraday.py
          python scripts/update_etf_data.py
          python scripts/postprocess_site.py
          python scripts/sanitize_economic_calendar.py
          python scripts/strict_investment_rotation.py
          python scripts/investment_trend_health_guard.py enforce
          python scripts/fix_selection_counters.py
          python scripts/apply_investment_mtf_confirmation.py
          python scripts/archive_investment_signals.py

      - name: Pubblica dati aggiornati
        if: steps.freshness.outputs.run_update == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/market-data.json data/market-history.json data/investment-selection-state.json data/translation-cache.json data/economic-calendar.json data/etf-data.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica dati da pubblicare'
            exit 0
          fi
          git commit -m 'Aggiornamento automatico dati (watchdog)'
          git fetch origin main
          LOCAL_BASE=$(git rev-parse HEAD^)
          REMOTE_HEAD=$(git rev-parse origin/main)
          if [ "$LOCAL_BASE" != "$REMOTE_HEAD" ]; then
            echo 'Main cambiato durante il run: nessun merge dei JSON.'
            exit 0
          fi
          git push origin HEAD:main
