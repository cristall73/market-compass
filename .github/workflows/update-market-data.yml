name: Update Trading Data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-market-data.yml'
  schedule:
    # Trading Coach: aggiornamento intraday ogni ora (UTC).
    - cron: '7 * * * *'

concurrency:
  # Un solo workflow alla volta può scrivere i dataset del sito.
  group: market-data-writes-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Refresh Trading intraday
        run: |
          python scripts/refresh_trading_intraday.py

      - name: Registra aggiornamento Trading
        run: |
          python scripts/mark_update_status.py trading

      - name: Commit e pubblica Trading data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/market-data.json data/update-status.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica Trading da pubblicare"
            exit 0
          fi
          git commit -m "Aggiornamento intraday Trading Coach"

          # Se main è cambiato durante il calcolo, integra le modifiche e pubblica
          # invece di terminare con un falso successo senza aggiornare il sito.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Tentativo $attempt non riuscito; riprovo."
            sleep 5
          done

          echo "Impossibile pubblicare i dati Trading dopo 3 tentativi."
          exit 1
