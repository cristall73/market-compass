name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests deep-translator

      - name: Update market data
        run: |
          python scripts/update_market_data.py

      - name: Stabilita selezione, italiano e calendario economico
        run: |
          python scripts/postprocess_site.py

      - name: Commit updated data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/market-data.json data/market-history.json data/investment-selection-state.json data/translation-cache.json data/economic-calendar.json
          git diff --cached --quiet || git commit -m "Aggiornamento automatico dati"
          git push
