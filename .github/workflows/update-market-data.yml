name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    # Trading Coach veloce: aggiorna ogni 15 minuti.
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-market-data.yml'
      - 'scripts/**'

# Un solo aggiornamento dati alla volta: se parte il successivo mentre il
# precedente e ancora attivo, annulla quello vecchio evitando conflitti di push.
concurrency:
  group: market-data-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests deep-translator

      - name: Update market data
        run: |
          python scripts/update_market_data.py

      - name: Controllo freschezza intraday
        run: |
          python scripts/refresh_trading_intraday.py

      - name: Update ETF e PAC
        run: |
          python scripts/update_etf_data.py

      - name: Stabilita selezione, italiano e calendario economico
        run: |
          python scripts/postprocess_site.py

      - name: Correzione contatori selezione
        run: |
          python scripts/fix_selection_counters.py

      - name: Commit updated data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/market-data.json data/market-history.json data/investment-selection-state.json data/translation-cache.json data/economic-calendar.json data/etf-data.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica dati da pubblicare"
            exit 0
          fi
          git commit -m "Aggiornamento automatico dati"
          git pull --rebase origin main
          git push origin HEAD:main
