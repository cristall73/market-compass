name: Update Trading Data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-market-data.yml'
  schedule:
    # Trading Coach: refresh intraday frequente e indipendente.
    - cron: '*/15 * * * *'

concurrency:
  group: trading-data-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Refresh Trading intraday
        run: |
          python scripts/refresh_trading_intraday.py

      - name: Registra aggiornamento Trading
        run: |
          python scripts/mark_update_status.py trading

      - name: Commit Trading data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/market-data.json data/update-status.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica Trading da pubblicare"
            exit 0
          fi
          git commit -m "Aggiornamento intraday Trading Coach"

          git fetch origin main
          LOCAL_BASE=$(git rev-parse HEAD^)
          REMOTE_HEAD=$(git rev-parse origin/main)
          if [ "$LOCAL_BASE" != "$REMOTE_HEAD" ]; then
            echo "Main cambiato durante il run Trading. Aggiornamento rimandato al prossimo ciclo."
            exit 0
          fi

          git push origin HEAD:main
