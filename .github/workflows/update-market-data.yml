name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    # Trading Coach veloce: aggiorna ogni 15 minuti.
    - cron: '*/15 * * * *'

# Un solo aggiornamento dati alla volta. I push manuali al codice non avviano
# più un secondo workflow mentre quello schedulato sta generando i JSON.
concurrency:
  group: market-data-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests deep-translator

      - name: Update market data
        run: |
          python scripts/update_market_data.py

      - name: Controllo freschezza intraday
        run: |
          python scripts/refresh_trading_intraday.py

      - name: Update ETF e PAC
        run: |
          python scripts/update_etf_data.py

      - name: Stabilita selezione, italiano e calendario economico
        run: |
          python scripts/postprocess_site.py

      - name: Blocco rotazione Investment Coach
        run: |
          python scripts/strict_investment_rotation.py

      - name: Conferma tecnica multi-timeframe Investing
        run: |
          python scripts/apply_investment_mtf_confirmation.py

      - name: Archivio segnali definitivi Investing
        run: |
          python scripts/archive_investment_signals.py

      - name: Correzione contatori selezione
        run: |
          python scripts/fix_selection_counters.py

      - name: Commit updated data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/market-data.json data/market-history.json data/investment-selection-state.json data/translation-cache.json data/economic-calendar.json data/etf-data.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica dati da pubblicare"
            exit 0
          fi
          git commit -m "Aggiornamento automatico dati"

          # Se il branch remoto è avanzato durante il calcolo (per esempio per una
          # modifica manuale al sito), non tentiamo un rebase dei JSON generati:
          # è proprio quello che causava i conflitti. In quel caso annulliamo
          # questo run e lasciamo che il successivo, partendo dall'ultimo main,
          # rigeneri tutto correttamente.
          git fetch origin main
          LOCAL_BASE=$(git rev-parse HEAD^)
          REMOTE_HEAD=$(git rev-parse origin/main)
          if [ "$LOCAL_BASE" != "$REMOTE_HEAD" ]; then
            echo "Il branch main è cambiato durante il run. Nessun merge dei JSON: aggiornamento rimandato al prossimo ciclo."
            exit 0
          fi

          git push origin HEAD:main
