name: Update Investment Coach

on:
  workflow_dispatch:
  schedule:
    # Investment Coach: aggiornamento lento e indipendente, coerente con orizzonte 2-4 mesi.
    - cron: '41 */4 * * *'

concurrency:
  group: investment-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-investing:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests deep-translator

      - name: Aggiorna dataset completo Investing
        run: |
          python scripts/update_market_data.py

      - name: Stabilita selezione e italiano
        run: |
          python scripts/postprocess_site.py

      - name: Snapshot candidati Investing
        run: |
          python scripts/investment_trend_health_guard.py snapshot

      - name: Veto anti-esplosione Investment Coach
        run: |
          python scripts/investment_trend_health_guard.py enforce

      - name: Correzione contatori selezione
        run: |
          python scripts/fix_selection_counters.py

      - name: Conferma tecnica multi-timeframe Investing
        run: |
          python scripts/apply_investment_mtf_confirmation.py

      - name: Archivio segnali definitivi Investing
        run: |
          python scripts/archive_investment_signals.py

      - name: Registra aggiornamento Investing
        run: |
          python scripts/mark_update_status.py investing

      - name: Commit dati Investing
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/market-data.json data/market-history.json data/investment-selection-state.json data/translation-cache.json data/economic-calendar.json data/update-status.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica Investing da pubblicare"
            exit 0
          fi
          git commit -m "Aggiornamento periodico Investment Coach"

          git fetch origin main
          LOCAL_BASE=$(git rev-parse HEAD^)
          REMOTE_HEAD=$(git rev-parse origin/main)
          if [ "$LOCAL_BASE" != "$REMOTE_HEAD" ]; then
            echo "Main cambiato durante il run Investing. Aggiornamento rimandato al prossimo ciclo."
            exit 0
          fi

          git push origin HEAD:main
